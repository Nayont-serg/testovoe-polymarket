[project]
name = "polymarket-wallet-history"
version = "0.1.0"
description = "Reconstructs Polymarket wallet balance history directly from Polygon RPC"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires docker Postgres and live network access",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM", "RUF",
    "ARG", "PT", "ASYNC", "T20", "BLE",
]
ignore = [
    "ANN401",  # `Any` is legitimate for raw JSON-RPC payloads (params/results are untyped JSON)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Optional".msg = "Use `X | None` instead."
"typing.Union".msg = "Use `X | Y` instead."
"typing.List".msg = "Use `list[X]` instead."
"typing.Dict".msg = "Use `dict[K, V]` instead."
"typing.Tuple".msg = "Use `tuple[X, ...]` instead."
"typing.Set".msg = "Use `set[X]` instead."

[tool.ruff.format]
quote-style = "double"
