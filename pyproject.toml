[project]
name = "polymarket-wallet-history"
version = "0.1.0"
description = "Reconstructs Polymarket wallet balance history directly from Polygon RPC"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires docker Postgres and live network access",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
